<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">

        <header>
            <div class="header-left">
                <img src="icons/logo.png" class="header-logo" alt="">
                <span class="header-title">Work Tracker</span>
            </div>
            <div class="header-right">
                <button id="settings-btn" class="icon-btn" aria-label="Settings" title="Settings">
                    <img src="icons/settings.png" alt="Settings">
                </button>
            </div>
        </header>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Settings">
            <div class="modal-content">
                <div class="modal-titlebar">
                    <span class="modal-titlebar-title">Settings</span>
                    <button id="close-settings" class="modal-titlebar-close" aria-label="Close">&#x2715;</button>
                </div>
                <div class="modal-body">
                    <label for="tunnel-url">
                        Cloudflare Tunnel URL
                        <span class="label-hint">Paste the URL from your tunnel session at home</span>
                        <input type="url" id="tunnel-url" placeholder="https://xxxx-xxxx.trycloudflare.com" autocomplete="off" spellcheck="false">
                    </label>
                    <label for="model-name">
                        Ollama Model
                        <span class="label-hint">Must be pulled on your home PC</span>
                        <input type="text" id="model-name" placeholder="llama3.2" autocomplete="off" spellcheck="false">
                    </label>
                    <div class="modal-actions">
                        <button id="save-settings" class="btn primary">Save</button>
                        <button id="cancel-settings" class="btn">Cancel</button>
                    </div>
                    <hr class="modal-divider">
                    <p class="modal-section-label">Data</p>
                    <div class="modal-actions">
                        <button id="download-notes" class="btn full-width">Download notes (JSON)</button>
                        <label class="btn full-width upload-label" for="upload-notes">
                            Upload notes (JSON)
                            <input type="file" id="upload-notes" accept=".json" style="display:none">
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab navigation -->
        <nav class="tab-nav" role="tablist">
            <button class="tab-btn active" data-tab="notes" role="tab" aria-selected="true">
                <img src="icons/calendar-5.png" alt="">
                Notes
            </button>
            <button class="tab-btn" data-tab="ask" role="tab" aria-selected="false">
                <img src="icons/send.png" alt="">
                Ask
            </button>
        </nav>

        <!-- ── NOTES TAB ── -->
        <div id="tab-notes" class="tab-panel">

            <div id="error-banner" class="error-banner hidden"></div>

            <section class="input-section">
                <label for="note-title" class="note-label">Subject
                    <input type="text" id="note-title" placeholder="Title" autocomplete="off">
                </label>
                <label for="note-body" class="note-label">Notes
                    <textarea id="note-body" placeholder="Notes..." rows="12"></textarea>
                </label>
                <button id="save-note-btn" class="btn primary full-width">
                    <img src="icons/calendar-5.png" alt="">
                    Save Note
                </button>
            </section>

            <div id="loading" class="loading hidden" aria-live="polite">
                <div class="spinner"></div>
                <span>Saving...</span>
            </div>

            <section class="log-section">
                <h2 class="section-label">History</h2>
                <div id="note-entries"></div>
            </section>

        </div>

        <!-- ── ASK TAB ── -->
        <div id="tab-ask" class="tab-panel hidden">

            <div id="chat-error-banner" class="error-banner hidden"></div>

            <div class="chat-toolbar">
                <button id="new-chat-btn" class="btn">
                    <img src="icons/new_chat_dark.png" alt="">
                    New chat
                </button>
            </div>

            <div id="chat-messages" class="chat-messages">
                <div class="chat-empty">Ask about people or projects from your notes — e.g. "When was Rebecca working in Unreal?"</div>
            </div>

            <div id="chat-loading" class="loading hidden" aria-live="polite">
                <div class="spinner"></div>
                <span>Thinking...</span>
            </div>

            <div class="chat-input-row">
                <textarea id="chat-input" placeholder="Ask a question about your notes..." rows="2"></textarea>
                <button id="chat-send-btn" class="btn primary" aria-label="Send">
                    <img src="icons/send.png" alt="Send">
                </button>
            </div>

        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
